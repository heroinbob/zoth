version: '3'

services:
  postgres:
    command: postgres -c max_connections=200
    container_name: zoth-postgres-18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    image: postgres:17.9
    ports:
      - "5432:5432"
    volumes:
      - zoth_postgres:/var/lib/postgresql/data

volumes:
  zoth_postgres: {}
